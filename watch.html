<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Videos | Miles Collection Stores</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-p="watch.html" data-h="none" class="wt"><div class="fd"><div class="wh2"><div class="tb"><button class="on" id="t1">For You</button><button id="t2">Saved</button></div><div class="lr"><a class="lg" href="index.html"><i>🛍</i> MILES</a><div><a class="i" href="shop.html" aria-label="Search">⌕</a> <button class="i" id="oc" aria-label="Cart">🛍<b class="cartn">0</b></button></div></div></div><div id="fd"></div><div id="tg" style="margin-top:10px"></div></div>
<nav class="bn"><a href="index.html"><span>⌂</span>Home</a><a href="collections.html"><span>◎</span>Discover</a><a href="watch.html" class="on"><span>▶</span>Videos/Play</a><a href="shop.html?w=1"><span>♥</span>Wishlist</a><a href="contact.html"><span>●</span>Contact</a></nav><script src="js/data.js"></script><script src="js/site.js"></script><script>const F=[{key:'v0',video:'assets/store-tour.mp4',img:'assets/poster.jpg',name:'Walk the store with us',sub:'Miles Collection, Greg Lungu Rd',tags:['Lusaka','Streetwear','Sneakers']}].concat(P.map(p=>({key:'p'+p.id,p,video:p.video,img:p.img,name:p.name,sub:p.cat,tags:[p.cat,'Streetwear','Lusaka']})));
let lk=MC.get('mc_likes',{}),sv=MC.get('mc_saved',[]),tab=1;
function draw2(){const l=F.filter(x=>tab==1||sv.includes(x.key));$('fd').innerHTML=l.map(x=>{const p=x.p;return `<section class="vc"><div class="md" data-k="${x.key}">${x.video?`<video src="${x.video}" poster="${x.img}" muted loop playsinline></video><div class="pl"><i>▶</i></div>`:`<a href="product.html?id=${p.id}"><img src="${x.img}" alt="${x.name}" loading="lazy"></a>`}</div>
<div class="rail"><button data-l="${x.key}" class="${lk[x.key]?'on':''}"><span>♥</span>${lk[x.key]||''}</button><button data-s="${x.key}" class="${sv.includes(x.key)?'on':''}"><span>🔖</span>Save</button><button data-w="${x.key}"><span>💬</span>Ask</button><button data-sh="${x.key}"><span>⇪</span>Share</button></div>
<div class="pb"><div class="r1"><img src="${x.img}" alt=""><div><b>${x.name}</b><small>${x.sub}</small></div></div>${p?`<div class="pr2">${m(p.price)}</div><button class="btn cr" data-a="${p.id}" ${p.soldout?'disabled':''}>🛍 ${p.soldout?'Sold out':'Add to Cart • Shop Now'}</button>`:'<br><a class="btn cr" href="shop.html">Shop Now</a>'}</div><div class="tgs">${x.tags.map(t=>`<span>#${t}</span>`).join('')}</div></section>`}).join('')||'<p style="text-align:center;color:#9fb0d0;margin-top:40px">Nothing saved yet. Tap the bookmark on a post.</p>';obs()}
function obs(){const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(!v)return;const pl=e.target.querySelector('.pl');if(e.isIntersecting&&e.intersectionRatio>.6){v.play().catch(()=>{});pl.classList.add('h')}else{v.pause();pl.classList.remove('h')}}),{threshold:[.6]});document.querySelectorAll('.md').forEach(e=>io.observe(e))}
document.addEventListener('click',e=>{const t=e.target.closest('button,.md'),d=t?t.dataset:{};if(d.l){lk[d.l]=(lk[d.l]||0)?0:1;MC.set('mc_likes',lk);draw2()}
if(d.s){sv=sv.includes(d.s)?sv.filter(x=>x!=d.s):[...sv,d.s];MC.set('mc_saved',sv);draw2()}
if(d.a){const p=P.find(x=>x.id==d.a);add(p.id,p.sizes.split(',')[0].trim())}
if(d.w){const x=F.find(y=>y.key==d.w);open('https://wa.me/'+S.whatsapp+'?text='+encodeURIComponent('Hello Miles Collection, I saw '+x.name+' in your videos.'),'_blank')}
if(d.sh){navigator.share?navigator.share({title:'Miles Collection',url:location.href}):navigator.clipboard.writeText(location.href).then(()=>alert('Link copied'))}
if(t&&t.classList.contains('md')){const v=t.querySelector('video');if(v){v.paused?v.play():v.pause();t.querySelector('.pl').classList.toggle('h',!v.paused)}}});
$('t1').onclick=()=>{tab=1;$('t1').classList.add('on');$('t2').classList.remove('on');draw2()};$('t2').onclick=()=>{tab=2;$('t2').classList.add('on');$('t1').classList.remove('on');draw2()};
$('oc').onclick=()=>$('dr').classList.add('open');draw2();</script></body></html>
