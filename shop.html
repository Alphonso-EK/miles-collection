<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Miles Collection Stores</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-p="shop.html" data-h="nova" class=""><div class="wrap"><div class="fbar"><h2>Shop <small id="cn"></small></h2><div><button id="fb">⚲ Filters</button><select id="so" aria-label="Sort"><option value="">Sort by: Newest ↓</option><option value="a">Price: low to high</option><option value="d">Price: high to low</option></select></div></div>
<div class="fp" id="fp"><input id="q" placeholder="Search products" aria-label="Search" style="max-width:240px"><span id="ch"></span><label><input type="checkbox" id="is"> In stock only</label></div><div class="grid" id="grid"></div><button class="more" id="mr">Load More Products</button></div><script src="js/data.js"></script><script src="js/site.js"></script><script>const u=new URLSearchParams(location.search);let cat=u.get('c')||'All',n=8,wish=u.get('w');
function go(){const q=$('q').value.toLowerCase(),s=$('so').value;let l=P.filter(p=>(cat=='All'||p.cat==cat)&&p.name.toLowerCase().includes(q)&&(!$('is').checked||!p.soldout)&&(!wish||fav.includes(p.id)));if(s)l.sort((a,b)=>s=='a'?a.price-b.price:b.price-a.price);
$('cn').textContent='– '+l.length+' products';$('ch').innerHTML=['All',...new Set(P.map(p=>p.cat))].map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${c}">${c}</button>`).join(' ');
$('grid').innerHTML=l.slice(0,n).map(card).join('')||'<p>'+(wish?'No saved items yet. Tap the heart on a product.':'No products found. Try another search or category.')+'</p>';$('mr').style.display=l.length>n?'block':'none'}
$('q').oninput=go;$('so').onchange=go;$('is').onchange=go;$('fb').onclick=()=>$('fp').classList.toggle('on');$('mr').onclick=()=>{n+=8;go()};$('ch').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;wish=0;n=8;go()}};if(cat!='All'||wish)$('fp').classList.add('on');go();</script></body></html>
