<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Miles Collection Stores</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-p="checkout.html" data-h="nova" class="ck"><div class="ckw"><div class="ckl" id="L"></div><div class="sm2" id="R"></div></div><script src="js/data.js"></script><script src="js/site.js"></script><script>let pay='Pay on collection',del='Collect in store',pc=null,done=null;
const lines=()=>cart.map(c=>({...c,p:P.find(x=>x.id==c.id)})).filter(x=>x.p);
function sums(){const sub=lines().reduce((a,x)=>a+x.p.price*x.q,0),d=pc?Math.round(sub*pc.pct/100):0;return{sub,d,t:sub-d}}
function render(){const ls=lines(),s=sums();
$('L').innerHTML=done?`<h2>Review</h2><div class="stp"><span class="dn">✓ Cart</span><span class="dn">✓ Details</span><span class="on">Review</span></div><h2>Order ${done.id} sent</h2><p style="margin:10px 0">Your order is saved and WhatsApp should have opened with the details. If it did not, tap below. We will reply to confirm stock and payment.</p><a class="btn gold" id="rw" href="#">Open WhatsApp again</a> <a class="btn ol" href="shop.html">Keep shopping</a>`:
`<h2>Your details</h2><div class="stp"><span class="dn">✓ Cart</span><span class="on">Details</span><span>Review</span></div><h2 style="font-size:18px">Payment method</h2><div class="pm" id="pm">${['Pay on collection','Mobile money','Cash on delivery'].map(x=>`<button class="${x==pay?'on':''}">${x}</button>`).join('')}</div>${pay=='Mobile money'?'<p>We will send you the mobile money payment details on WhatsApp once we confirm your order.</p>':''}
<label for="nm">Name</label><input id="nm" autocomplete="name"><label for="ph">Phone number</label><input id="ph" type="tel" autocomplete="tel" placeholder="097..."><label>Collect or deliver</label><div class="pm" id="dm">${['Collect in store','Delivery'].map(x=>`<button class="${x==del?'on':''}">${x}</button>`).join('')}</div>${del=='Delivery'?'<label for="ad">Delivery address</label><input id="ad" autocomplete="street-address">':''}<label for="nt">Notes (optional)</label><textarea id="nt" rows="2"></textarea><label for="pcd">Promo code</label><div style="display:flex;gap:8px"><input id="pcd" placeholder="Enter code"><button class="btn ol" id="ap">Apply</button></div>`;
$('R').innerHTML=`<h2>Order Summary</h2><p style="color:var(--mut)">${ls.length} item${ls.length==1?'':'s'}</p>${ls.map(x=>`<div class="oi"><div class="th"><img src="${x.p.img}" alt=""></div><div><b>${x.p.name}</b><small>Size: ${x.size} • Qty: ${x.q}</small></div><b>${m(x.p.price*x.q)}</b></div>`).join('')||'<p>Your cart is empty. <a href="shop.html">Shop the collection</a></p>'}<hr style="border:0;border-top:1px solid #e1e5ef;margin:14px 0"><div class="tr"><span>Subtotal</span><b>${m(s.sub)}</b></div><div class="tr"><span>Delivery</span><span class="grn">Arranged on WhatsApp</span></div><div class="tr"><span>Discount</span><span class="grn">${s.d?'-'+m(s.d):m(0)}</span></div><div class="tr tt"><span>Total</span><span>${m(s.t)}</span></div><br><button class="btn pill" id="go" style="background:var(--navy)" ${ls.length&&!done?'':'disabled'}>Send order on WhatsApp • ${m(s.t)}</button>`;bind()}
function msg(o){return `Hello Miles Collection, I would like to order:\n${o.lines.join('\n')}\nTotal: ${m(o.total)}${o.discount?' (promo '+o.promo+')':''}\nName: ${o.name}\nPhone: ${o.phone}\n${o.delivery}${o.addr?': '+o.addr:''}\nPayment: ${o.method}${o.note?'\nNote: '+o.note:''}`}
function bind(){if(done){$('rw').href='https://wa.me/'+S.whatsapp+'?text='+encodeURIComponent(msg(done));$('rw').target='_blank';return}
$('pm').onclick=e=>{if(e.target.tagName=='BUTTON'){keep();pay=e.target.textContent;render();rest()}};$('dm').onclick=e=>{if(e.target.tagName=='BUTTON'){keep();del=e.target.textContent;render();rest()}};
$('ap').onclick=()=>{const c=MC.promos().find(x=>x.code.toLowerCase()==$('pcd').value.trim().toLowerCase());pc=c||null;keep();render();rest();alert(c?'Promo applied':'That code is not valid')};
$('go').onclick=()=>{const nm=$('nm').value.trim(),ph=$('ph').value.trim();if(!nm||!ph){alert('Please enter your name and phone number');return}
const s=sums(),ls=lines(),o={name:nm,phone:ph,addr:del=='Delivery'&&$('ad')?$('ad').value:'',method:pay,delivery:del,note:$('nt').value,promo:pc?pc.code:'',discount:s.d,total:s.t,
lines:ls.map(x=>`- ${x.p.name}, size ${x.size} x${x.q} (${m(x.p.price*x.q)})`),items:ls.map(x=>({id:x.p.id,name:x.p.name,size:x.size,q:x.q,price:x.p.price}))};
done=MC.addOrder(o);cart=[];draw();open('https://wa.me/'+S.whatsapp+'?text='+encodeURIComponent(msg(done)),'_blank');render()}}
let sv={};function keep(){sv={nm:$('nm').value,ph:$('ph').value,ad:$('ad')?$('ad').value:'',nt:$('nt').value,pcd:$('pcd').value}}function rest(){for(const k in sv)if($(k))$(k).value=sv[k]}
render();</script></body></html>
