<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Miles Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>.pwf{-webkit-text-security:disc;text-security:disc}</style></head><body>
<div id="app"></div><script src="js/data.js"></script><script>
const $=id=>document.getElementById(id),app=$('app');
let S=MC.settings(),P=[],V=[],O=[],tab='dash',st={pg:1,q:'',f:'All',cat:'All',stt:'All',sort:'new',view:null,sel:null,edit:null,form:null};
const load=()=>{P=MC.all();V=MC.videos();O=MC.orders()},money=n=>S.currency+Number(n).toLocaleString(),dt=t=>t?new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'-',esc=s=>String(s).replace(/"/g,'&quot;'),fd=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'),kk=n=>n>=1000?(n/1000).toFixed(1)+'K':n;
const col=n=>`hsl(${[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 55% 45%)`,av=n=>`<span class="av" style="background:${col(n)}">${String(n).split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}</span>`;
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1800)};
const hd=(t,s,a='')=>`<div class="hd"><div><h2>${t}</h2><span class="sub">${s||''}</span></div><div class="ac">${a}</div></div>`;
const stat=(l,v,n,c='up')=>`<div class="stat"><small>${l}</small><b>${v}</b><em class="${c}">${n||''}</em></div>`;
const sp=s=>`<span class="sp s-${String(s).replace(/ /g,'')}">${s}</span>`;
const pager=(n,per)=>{const c=Math.ceil(n/per)||1;return `<div class="pgn"><span>Showing ${n?(st.pg-1)*per+1:0}-${Math.min(st.pg*per,n)} of ${n}</span><div><button data-p="${Math.max(1,st.pg-1)}">‹ Previous</button>${[...Array(Math.min(c,5))].map((_,i)=>`<button class="${i+1==st.pg?'on':''}" data-p="${i+1}">${i+1}</button>`).join('')}${c>5?'…<button data-p="'+c+'">'+c+'</button>':''}<button data-p="${Math.min(c,st.pg+1)}">Next ›</button></div></div>`};
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()};
document.addEventListener('input',e=>{if(e.target.id=='sq')st.fs=1});
const ssearch=()=>{const e=$('sq');if(e&&st.fs){st.fs=0;const v=e.value;e.focus();e.setSelectionRange(v.length,v.length)}};
/* login */
function login(){app.innerHTML=`<div class="login"><h2 style="font:800 26px Inter">Admin login</h2><p class="sub" style="color:var(--mut)">First time? The password is miles2026. Change it in Settings.</p><br><label for="pw" style="font-weight:600">Password</label><div class="row"><input id="pw" class="pwf" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus><button class="btn ol" id="sw" type="button">Show</button></div><br><button class="btn gold" id="go" type="button" style="width:100%">Log in</button></div>`;
$('sw').onclick=()=>{$('pw').classList.toggle('pwf');$('sw').textContent=$('pw').classList.contains('pwf')?'Show':'Hide'};
const ok=()=>{if($('pw').value.trim()===S.password){MC.ss.set('mc_in','1');shell()}else toast('Wrong password')};$('go').onclick=ok;$('pw').onkeydown=e=>{if(e.key=='Enter')ok()};setTimeout(()=>$('pw').focus(),50)}
const T=[['dash','▦','Dashboard'],['ord','☰','Orders'],['prod','▣','Products'],['cus','☺','Customers'],['vid','▶','Videos'],['inv','▤','Inventory'],['ana','▮','Analytics'],['pro','%','Promotions']];
function shell(){const b=x=>`<button class="nv ${tab==x[0]?'on':''}" data-t="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`;
app.innerHTML=`<div class="adm"><aside class="sd"><div class="lg"><span class="lm">👕</span><div>MILES<br><small>COLLECTION</small></div></div>${T.map(b).join('')}<hr>${b(['set','⚙','Settings'])}${b(['help','?','Help & Support'])}<a href="index.html" class="nv" style="color:#dfe6f7;padding:11px 12px;text-decoration:none;font-weight:600">↗ View store</a><div class="me">${av('Admin User')}<div><b>Admin User</b><small>Store admin</small></div><button id="out" aria-label="Log out">⎋</button></div></aside><main class="mn" id="mn"></main></div>`;
document.querySelector('.sd').onclick=e=>{const x=e.target.closest('button.nv');if(x){tab=x.dataset.t;st={...st,pg:1,q:'',f:'All',cat:'All',stt:'All',view:null,edit:null,form:null};shell()}};
$('out').onclick=()=>{MC.ss.del('mc_in');login()};load();({dash,ord,prod,cus,vid,inv,ana:()=>vid(1),pro,set,help:()=>$('mn').innerHTML=hd('Help & Support','')+'<div class="pn">Add products under Products. Orders from the store appear under Orders. Link or add videos under Videos. Everything you change here is saved in this browser. Orders arrive on WhatsApp +'+S.whatsapp+'.</div>'}[tab])()}
/* dashboard */
function dash(){const ok=O.filter(o=>o.status!='Cancelled'),low=P.filter(p=>p.stock<=3);$('mn').innerHTML=hd('Dashboard','Store overview')+`<div class="stats">${stat('Revenue',money(ok.reduce((a,o)=>a+o.total,0)),'excluding cancelled')}${stat('Orders',O.length,O.filter(o=>o.status=='Pending').length+' pending','wn')}${stat('Products',P.length,P.filter(p=>p.status=='draft').length+' drafts','wn')}${stat('Video views',V.reduce((a,x)=>a+x.views,0),'this browser')}</div>
<div class="two"><div class="pn"><h3>Recent orders</h3><table><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th></tr>${O.slice(0,5).map(o=>`<tr><td>${o.id}</td><td>${o.name}</td><td>${sp(o.status)}</td><td>${money(o.total)}</td></tr>`).join('')||'<tr><td colspan="4">No orders yet.</td></tr>'}</table></div><div class="pn"><h3>Low stock</h3><br>${low.map(p=>`<div class="cu" style="margin-bottom:8px"><img class="t" src="${p.img}" alt=""><div><b>${p.name}</b><br><small class="dn">${p.stock} left</small></div></div>`).join('')||'<span class="sub">All products are well stocked.</span>'}</div></div>`}
/* orders */
const STS=['Pending','Processing','Shipped','Delivered','Cancelled'],SC={Delivered:'#2fa564',Shipped:'#3a63d8',Processing:'#ef9b2a',Pending:'#d9b13b',Cancelled:'#d64545'};
function donut(){const t=O.length||1;let off=25;const g=STS.slice().reverse().map(s=>{const n=O.filter(o=>o.status==s).length,p=n/t*100,r=`<circle r="15.9" cx="21" cy="21" fill="none" stroke="${SC[s]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;return r}).join('');
return `<div class="donut"><svg viewBox="0 0 42 42" width="170" role="img" aria-label="Order status">${O.length?g:'<circle r="15.9" cx="21" cy="21" fill="none" stroke="#e6e4de" stroke-width="6"/>'}</svg></div><div class="lgd">${STS.map(s=>`<span><i style="background:${SC[s]}"></i>${s} (${O.filter(o=>o.status==s).length})</span>`).join('')}</div>`}
function ord(){load();const q=st.q.toLowerCase(),l=O.filter(o=>(st.f=='All'||o.status==st.f)&&(o.name+o.id+o.lines.join(' ')).toLowerCase().includes(q)),rows=l.slice((st.pg-1)*6,st.pg*6),v=O.find(o=>o.id==st.view);
$('mn').innerHTML=hd('Orders Management','',`<input id="sq" placeholder="Search orders, customers..." value="${esc(st.q)}"><button class="btn ol" id="ex">⭳ Export</button><button class="btn gold" id="no">＋ New Order</button>`)+
`<div class="stats">${stat('Total Orders',O.length,'all time')}${stat('Revenue',money(O.filter(o=>o.status!='Cancelled').reduce((a,o)=>a+o.total,0)),'excluding cancelled')}${stat('Pending',O.filter(o=>o.status=='Pending').length,'need action','dn')}${stat('Delivered',O.filter(o=>o.status=='Delivered').length,'completed')}</div>`+
(st.form=='order'?`<div class="pn form"><div><label>Customer</label><input id="fn"></div><div><label>Phone</label><input id="fp"></div><div><label>Product</label><select id="fpr">${P.map(p=>`<option value="${p.id}">${p.name} (${money(p.price)})</option>`).join('')}</select></div><div><label>Size and quantity</label><div style="display:flex;gap:8px"><input id="fs" placeholder="Size"><input id="fq" type="number" value="1" min="1"></div></div><div class="full"><button class="btn gold" id="fsv">Save order</button> <button class="btn ol" id="fcn">Cancel</button></div></div>`:'')+
(v?`<div class="pn"><div class="hd" style="margin:0 0 10px"><h3>${v.id} · ${v.name}</h3><button class="btn ol sm" id="vc">Close</button></div><p>${v.lines.join('<br>')||'No items listed'}</p><p style="margin-top:8px"><b>Total ${money(v.total)}</b> · ${v.method||''} ${v.delivery?'· '+v.delivery:''}<br>Phone: ${v.phone||'-'} ${v.addr?'· Address: '+v.addr:''} ${v.note?'<br>Note: '+v.note:''}</p><br><div style="display:flex;gap:10px;align-items:center"><select id="vs" style="width:200px">${STS.map(s=>`<option ${s==v.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn dg sm" id="vd">Delete order</button></div></div>`:'')+
`<div class="two"><div class="pn"><div class="hd" style="margin:0"><h3>Orders</h3><div class="chips" style="margin:0">${['All',...STS].map(s=>`<button class="chip ${st.f==s?'on':''}" data-f="${s}">${s}</button>`).join('')}</div></div><table><tr><th>Order ID</th><th>Customer</th><th>Product</th><th>Date</th><th>Status</th><th>Total</th><th>Action</th></tr>${rows.map(o=>`<tr><td><b>${o.id}</b></td><td><div class="cu">${av(o.name)}${o.name}</div></td><td>${(o.lines[0]||'-').replace(/^- /,'')}${o.lines.length>1?' +'+(o.lines.length-1)+' more':''}</td><td>${dt(o.ts)}</td><td>${sp(o.status)}</td><td>${money(o.total)}</td><td><button class="lk2" data-v="${o.id}">View →</button></td></tr>`).join('')||'<tr><td colspan="7">No orders yet. Orders sent from the store checkout appear here.</td></tr>'}</table>${pager(l.length,6)}</div><div class="pn"><h3>Order Status Overview</h3>${donut()}</div></div>`;
ssearch();$('sq').oninput=e=>{st.q=e.target.value;st.pg=1;ord()};$('ex').onclick=()=>dl('orders.csv','id,date,customer,phone,status,total\n'+O.map(o=>[o.id,dt(o.ts),o.name,o.phone,o.status,o.total].join(',')).join('\n'),'text/csv');
$('no').onclick=()=>{st.form='order';ord()};if($('fcn'))$('fcn').onclick=()=>{st.form=null;ord()};
if($('fsv'))$('fsv').onclick=()=>{const p=P.find(x=>x.id==$('fpr').value),q=+$('fq').value||1,n=$('fn').value.trim();if(!n)return toast('Enter a customer name');MC.addOrder({name:n,phone:$('fp').value,method:'Added by admin',lines:[`- ${p.name}, size ${$('fs').value||'-'} x${q} (${money(p.price*q)})`],items:[{id:p.id,name:p.name,size:$('fs').value,q,price:p.price}],total:p.price*q});st.form=null;toast('Order added');ord()};
if(v){$('vc').onclick=()=>{st.view=null;ord()};$('vs').onchange=e=>{MC.saveOrders(MC.orders().map(o=>o.id==v.id?{...o,status:e.target.value}:o));toast('Status updated');ord()};$('vd').onclick=()=>{if(confirm('Delete this order?')){MC.saveOrders(MC.orders().filter(o=>o.id!=v.id));st.view=null;ord()}}}
$('mn').onclick=e=>{const d=e.target.closest('[data-p],[data-f],[data-v]')?.dataset||{};if(d.p){st.pg=+d.p;ord()}if(d.f){st.f=d.f;st.pg=1;ord()}if(d.v){st.view=d.v;ord()}}}
/* customers */
function custs(){const m={};O.forEach(o=>{const k=(o.name+'|'+o.phone).toLowerCase(),c=m[k]=m[k]||{k,name:o.name,phone:o.phone,orders:[],spent:0,last:0};c.orders.push(o);if(o.status!='Cancelled')c.spent+=o.total;c.last=Math.max(c.last,o.ts)});
MC.get('mc_cust',[]).forEach(x=>{const k=(x.name+'|'+x.phone).toLowerCase();if(!m[k])m[k]={k,...x,orders:[],spent:0,last:0}});return Object.values(m).map(c=>({...c,status:c.last&&Date.now()-c.last<30*864e5?'Active':'Inactive'}))}
function cus(){load();const all=custs(),q=st.q.toLowerCase(),l=all.filter(c=>(st.stt=='All'||c.status==st.stt)&&(c.name+c.phone).toLowerCase().includes(q)),rows=l.slice((st.pg-1)*5,st.pg*5),sel=all.find(c=>c.k==st.sel)||all[0],act=all.filter(c=>c.status=='Active').length,sp2=all.filter(c=>c.spent);
$('mn').innerHTML=hd('Customers','',`<button class="btn ol" id="ex">⭳ Export</button><button class="btn gold" id="ac">＋ Add Customer</button>`)+`<div class="stats">${stat('Total Customers',all.length,'from orders and manual adds')}${stat('Active Customers',act,'ordered in last 30 days')}${stat('Avg. Spend',money(sp2.length?Math.round(sp2.reduce((a,c)=>a+c.spent,0)/sp2.length):0),'per buying customer')}</div>
<div class="two" style="grid-template-columns:1fr 340px"><div class="pn"><input id="sq" placeholder="Search by name or phone..." value="${esc(st.q)}"><div style="margin:12px 0"><select id="ss" style="width:160px">${['All','Active','Inactive'].map(s=>`<option ${st.stt==s?'selected':''}>${s}</option>`).join('')}</select></div><table><tr><th>Customer</th><th>Orders</th><th>Spent</th><th>Last purchase</th><th>Status</th></tr>${rows.map(c=>`<tr class="${sel&&c.k==sel.k?'sel':''}" data-k="${c.k}" style="cursor:pointer"><td><div class="cu">${av(c.name)}<div><b>${c.name}</b><br><small style="color:var(--mut)">${c.phone||''}</small></div></div></td><td>${c.orders.length}</td><td>${money(c.spent)}</td><td>${dt(c.last)}</td><td>${sp(c.status)}</td></tr>`).join('')||'<tr><td colspan="5">No customers yet. They appear after an order.</td></tr>'}</table>${pager(l.length,5)}</div>
<div class="pn"><h3>Purchase History</h3>${sel?`<small style="color:var(--mut)">${sel.name} • ${sel.phone||'no phone'}</small><p style="background:#f6f7fb;padding:6px 8px;font-size:12px;margin:8px 0">Total Spent ${money(sel.spent)} • ${sel.orders.length} Orders</p><b>Recent Orders</b>${sel.orders.slice(0,4).map(o=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font-size:13px"><b>${o.id}</b> ${sp(o.status)} <small>${dt(o.ts)}</small><br>${o.lines.join('<br>')}<br><b>Total: ${money(o.total)}</b></div>`).join('')||'<p class="sub">No orders yet.</p>'}<button class="btn ol" id="va" style="width:100%">View All Orders →</button>`:'<p class="sub">Select a customer.</p>'}</div></div>`;
ssearch();$('sq').oninput=e=>{st.q=e.target.value;st.pg=1;cus()};$('ss').onchange=e=>{st.stt=e.target.value;st.pg=1;cus()};
$('ex').onclick=()=>dl('customers.csv','name,phone,orders,spent\n'+all.map(c=>[c.name,c.phone,c.orders.length,c.spent].join(',')).join('\n'),'text/csv');
$('ac').onclick=()=>{const n=prompt('Customer name');if(!n)return;const l2=MC.get('mc_cust',[]);l2.push({name:n,phone:prompt('Phone number')||''});MC.set('mc_cust',l2);cus()};
if($('va'))$('va').onclick=()=>{tab='ord';st.q=sel.name;st.pg=1;shell()};
$('mn').onclick=e=>{const r=e.target.closest('tr[data-k]'),d=e.target.closest('[data-p]');if(d){st.pg=+d.dataset.p;cus()}else if(r){st.sel=r.dataset.k;cus()}}}
/* products */
function prod(){if(st.edit!==null)return pform();load();const q=st.q.toLowerCase();let l=P.filter(p=>(st.cat=='All'||p.cat==st.cat)&&(st.stt=='All'||(st.stt=='Out of Stock'?p.stock<=0:st.stt.toLowerCase()==p.status))&&(p.name+p.sku+p.cat).toLowerCase().includes(q));
if(st.sort=='a')l.sort((a,b)=>a.price-b.price);if(st.sort=='d')l.sort((a,b)=>b.price-a.price);if(st.sort=='n')l.sort((a,b)=>a.name.localeCompare(b.name));const rows=l.slice((st.pg-1)*5,st.pg*5);
$('mn').innerHTML=hd('Products','Manage your clothing products, media and inventory',`<button class="btn gold" id="add">＋ Add Product</button>`)+`<div class="stats">${stat('Total Products',P.length,P.filter(p=>p.status=='draft').length+' drafts','wn')}${stat('Low Stock',P.filter(p=>p.stock>0&&p.stock<=3).length,'Needs restock','dn')}${stat('In Stock',P.filter(p=>p.stock>0&&p.status!='draft').length,'Healthy')}${stat('With Video',P.filter(p=>p.video).length,P.length?Math.round(P.filter(p=>p.video).length/P.length*100)+'% of products':'','wn')}</div>
<div class="pn"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><input id="sq" placeholder="Search products by name, SKU, category..." value="${esc(st.q)}" style="flex:1;min-width:200px"><select id="sc" style="width:auto"><option>All</option>${[...new Set(P.map(p=>p.cat))].map(c=>`<option ${st.cat==c?'selected':''}>${c}</option>`).join('')}</select><select id="ss" style="width:auto">${['All','Active','Draft','Out of Stock'].map(s=>`<option ${st.stt==s?'selected':''}>${s}</option>`).join('')}</select><select id="so" style="width:auto"><option value="new">Sort: Newest</option><option value="a" ${st.sort=='a'?'selected':''}>Price: low to high</option><option value="d" ${st.sort=='d'?'selected':''}>Price: high to low</option><option value="n" ${st.sort=='n'?'selected':''}>Name</option></select></div>
<table><tr><th>#</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Media</th><th>Status</th><th>Actions</th></tr>${rows.map((p,i)=>{const s=p.stock<=0?'Out of Stock':p.status=='draft'?'Draft':'Active';return `<tr><td>${(st.pg-1)*5+i+1}.</td><td><div class="cu"><img class="t" src="${p.img}" alt=""><div><b>${p.name}</b><br><small style="color:var(--mut)">SKU: ${p.sku}</small></div></div></td><td>${p.cat}</td><td>${money(p.price)}</td><td>${p.stock}${p.stock>0&&p.stock<=3?'<br><small class="dn">Low</small>':''}</td><td>${MC.imgs(p).length}${p.video?' ▶':''}</td><td>${sp(s)}</td><td><button class="btn ol sm" data-e="${p.id}">Edit</button> <button class="btn ol sm" style="color:#d64545" data-d="${p.id}">Delete</button></td></tr>`}).join('')||'<tr><td colspan="8">No products found.</td></tr>'}</table>${pager(l.length,5)}</div>`;
ssearch();$('sq').oninput=e=>{st.q=e.target.value;st.pg=1;prod()};$('sc').onchange=e=>{st.cat=e.target.value;st.pg=1;prod()};$('ss').onchange=e=>{st.stt=e.target.value;st.pg=1;prod()};$('so').onchange=e=>{st.sort=e.target.value;prod()};$('add').onclick=()=>{st.edit=0;prod()};
$('mn').onclick=e=>{const d=e.target.closest('[data-p],[data-e],[data-d]')?.dataset||{};if(d.p){st.pg=+d.p;prod()}if(d.e){st.edit=+d.e;prod()}if(d.d&&confirm('Delete this product?')){MC.saveProducts(P.filter(p=>p.id!=d.d));toast('Deleted');prod()}}}
function pform(){const p=P.find(x=>x.id==st.edit)||{name:'',cat:'Jackets',price:'',sizes:'M, L, XL',img:'',desc:'',stock:10,status:'active',video:'',sku:'MC-'+String(Date.now()).slice(-4)};let imgs=st.edit?[...MC.imgs(p)]:[];
$('mn').innerHTML=hd(st.edit?'Edit product':'Add product','')+`<div class="pn form"><div><label>Name</label><input id="n" value="${esc(p.name)}"></div><div><label>Category</label><input id="c" list="cl" value="${esc(p.cat)}"><datalist id="cl"><option>Jackets<option>Sneakers<option>Tees<option>Outfits</datalist></div><div><label>Price (${S.currency})</label><input id="pr" type="number" value="${p.price}"></div><div><label>Stock quantity</label><input id="sk" type="number" value="${p.stock}"></div><div><label>SKU</label><input id="su" value="${esc(p.sku)}"></div><div><label>Status</label><select id="stt"><option value="active">Active</option><option value="draft" ${p.status=='draft'?'selected':''}>Draft (hidden from store)</option></select></div><div class="full"><label>Sizes, comma separated</label><input id="sz" value="${esc(p.sizes)}"></div><div class="full"><label>Description</label><textarea id="ds" rows="3">${p.desc}</textarea></div><div class="full"><label>Video file path (optional, copy the .mp4 into the assets folder first, e.g. assets/jacket.mp4)</label><input id="vi" value="${esc(p.video)}"></div>
<div><label>Upload photos (pick several)</label><input type="file" id="fl" accept="image/*" multiple></div><div><label>Or add a store photo</label><select id="lib"><option value="">Choose</option>${['look-pink','flatlay','store-kaws','crazy-adidas','asics-brown','asics-black','asics-grey','checker-jacket','leather-varsity','red-varsity','green-varsity','brown-moto','tees','pink-racing','owner'].map(x=>`<option value="${IMG}${x}.jpg">${x}</option>`).join('')}</select></div><div class="full"><label>Photos (first is the main photo)</label><div id="pv" style="display:flex;gap:10px;flex-wrap:wrap"></div></div><div class="full"><button class="btn gold" id="sv">Save product</button> <button class="btn ol" id="cn">Cancel</button></div></div>`;
const dr=()=>{$('pv').innerHTML=imgs.map((s,i)=>`<div style="position:relative"><img src="${s}" alt="" style="width:90px;height:90px;object-fit:cover;border-radius:8px"><button class="btn sm dg" data-x="${i}" style="position:absolute;top:2px;right:2px;padding:1px 7px" aria-label="Remove">✕</button>${i?`<button class="btn sm ol" data-f="${i}" style="position:absolute;bottom:2px;left:2px;padding:1px 6px;font-size:11px">Main</button>`:''}</div>`).join('')||'<small class="sub">No photos yet.</small>'};dr();
$('pv').onclick=e=>{const d=e.target.dataset;if(d.x!==undefined){imgs.splice(d.x,1);dr()}if(d.f){imgs.unshift(imgs.splice(d.f,1)[0]);dr()}};$('lib').onchange=e=>{if(e.target.value){imgs.push(e.target.value);dr();e.target.value=''}};
$('fl').onchange=e=>{[...e.target.files].forEach(fi=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const z=Math.min(1,800/i.width),c=document.createElement('canvas');c.width=i.width*z;c.height=i.height*z;c.getContext('2d').drawImage(i,0,0,c.width,c.height);imgs.push(c.toDataURL('image/jpeg',.8));dr()};i.src=r.result};r.readAsDataURL(fi)})};
$('cn').onclick=()=>{st.edit=null;prod()};$('sv').onclick=()=>{if(!$('n').value||!imgs.length)return toast('Add a name and at least one photo');const o={id:st.edit||Date.now(),name:$('n').value,cat:$('c').value||'Other',price:+$('pr').value||0,stock:+$('sk').value||0,sku:$('su').value,status:$('stt').value,sizes:$('sz').value||'One size',img:imgs[0],imgs,desc:$('ds').value,video:$('vi').value.trim()};
const l=st.edit?P.map(x=>x.id==st.edit?o:x):[o,...P];if(MC.saveProducts(l)){toast('Saved');st.edit=null;prod()}}}
function inv(){load();$('mn').innerHTML=hd('Inventory','Update stock counts')+`<div class="pn"><table><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Status</th></tr>${P.map(p=>`<tr><td><div class="cu"><img class="t" src="${p.img}" alt=""><b>${p.name}</b></div></td><td>${p.sku}</td><td><input type="number" min="0" value="${p.stock}" data-i="${p.id}" style="width:90px"></td><td>${sp(p.stock<=0?'Out of Stock':p.stock<=3?'Pending':'Active')}${p.stock>0&&p.stock<=3?' Low':''}</td></tr>`).join('')}</table></div>`;
$('mn').onchange=e=>{const i=e.target.dataset.i;if(i){MC.saveProducts(P.map(p=>p.id==i?{...p,stock:+e.target.value||0}:p));toast('Stock saved');inv()}}}
/* videos and analytics */
function vstats(){const v=V.reduce((a,x)=>a+x.views,0),s=V.reduce((a,x)=>a+x.secs,0);return `<div class="stats">${stat('Total Views',kk(v),'plays on the store')}${stat('Watch Time',(s/3600).toFixed(1)+'h','total')}${stat('Engagement Rate',(v?(s/(v*107)*100).toFixed(1):0)+'%','watch time per view')}${stat('Conversions',O.length,'orders placed')}</div>`}
function chart(){const d=MC.get('mc_daily',{}),days=[...Array(14)].map((_,i)=>new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10)),a=days.map(x=>d[x]||0),mx=Math.max(...a,1);return `<svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Views, last 14 days"><polyline fill="none" stroke="#c9a24d" stroke-width="3" points="${a.map((v,i)=>`${10+i*21.5},${110-v/mx*90}`).join(' ')}"/><text x="10" y="126" font-size="9" fill="#6b7488">${days[0].slice(5)}</text><text x="250" y="126" font-size="9" fill="#6b7488">${days[13].slice(5)}</text></svg>`}
function store(){let u=0;for(let i=0;i<localStorage.length;i++){const x=localStorage.key(i);u+=(x+localStorage.getItem(x)).length*2}const p=Math.min(100,u/5242880*100);return `<div class="pn"><h3>Storage Used</h3><div class="bar2"><i style="width:${p}%"></i></div><small>${(u/1048576).toFixed(2)} MB of ~5 MB browser storage • ${p.toFixed(0)}%</small></div>`}
function vid(only){if(st.edit!==null)return vform();load();const q=st.q.toLowerCase(),l=V.filter(x=>(x.title+x.sku).toLowerCase().includes(q)),rows=l.slice((st.pg-1)*4,st.pg*4),top=[...V].sort((a,b)=>b.views-a.views)[0];
$('mn').innerHTML=hd(only?'Analytics':'Video Management',only?'Video performance':'Manage and track product videos',only?'':`<button class="btn gold" id="up">＋ Upload Video</button><button class="btn ol" id="csv">⭳ Export CSV</button>`)+vstats()+
`<div class="two"><div>${only?'':`<div class="pn"><h3>Product Videos</h3><br><input id="sq" placeholder="Search videos..." value="${esc(st.q)}" style="max-width:260px"><br><br><table><tr><th>Product</th><th>Video</th><th>Duration</th><th>Views</th><th>Status</th><th>Actions</th></tr>${rows.map(x=>`<tr><td><div class="cu"><img class="t" src="${x.thumb}" alt=""><div><b>${x.title}</b><br><small style="color:var(--mut)">SKU: ${x.sku}</small></div></div></td><td><div class="vt"><img src="${x.thumb}" alt=""><span>▶</span><small>${fd(x.dur)}</small></div></td><td>${fd(x.dur)}</td><td>${kk(x.views)}</td><td>${sp(x.status=='Draft'?'Draft':'Active')}</td><td><button class="ib" data-e="${x.id}" aria-label="Edit">✎</button><button class="ib" data-d="${x.id}" aria-label="Delete">🗑</button></td></tr>`).join('')||'<tr><td colspan="6">No videos found.</td></tr>'}</table>${pager(l.length,4)}</div>`}<div class="pn"><h3>Analytics Overview</h3><small class="sub">Video views, last 14 days</small>${chart()}</div></div><div>${top?`<div class="pn"><h3>Top Performing Video</h3><br><div class="cu"><div class="vt"><img src="${top.thumb}" alt=""><span>▶</span></div><div><b>${top.title}</b><br><small>${kk(top.views)} views</small></div></div></div>`:''}${store()}</div></div>`;
if(!only){ssearch();$('sq').oninput=e=>{st.q=e.target.value;st.pg=1;vid()};$('up').onclick=()=>{st.edit=0;vid()};$('csv').onclick=()=>dl('videos.csv','title,sku,src,status,views,seconds\n'+V.map(x=>[x.title,x.sku,x.src,x.status,x.views,x.secs].join(',')).join('\n'),'text/csv');
$('mn').onclick=e=>{const d=e.target.closest('[data-e],[data-d],[data-p]')?.dataset||{};if(d.p){st.pg=+d.p;vid()}if(d.e){st.edit=+d.e;vid()}if(d.d&&confirm('Delete this video entry?')){MC.set('mc_videos',V.filter(x=>x.id!=d.d));vid()}}}}
function vform(){const x=V.find(a=>a.id==st.edit)||{title:'',sku:'MC-VID-00'+(V.length+1),src:'assets/',thumb:P[0].img,status:'Published',views:0,secs:0,dur:0};
$('mn').innerHTML=hd(st.edit?'Edit video':'Upload video','')+`<div class="pn form"><div><label>Product</label><select id="pr">${P.map(p=>`<option value="${p.img}" ${p.img==x.thumb?'selected':''}>${p.name}</option>`).join('')}</select></div><div><label>Title</label><input id="ti" value="${esc(x.title)}"></div><div><label>SKU</label><input id="sk" value="${esc(x.sku)}"></div><div><label>Status</label><select id="stt"><option>Published</option><option ${x.status=='Draft'?'selected':''}>Draft</option></select></div><div class="full"><label>Video file path (copy your .mp4 into the assets folder, then type assets/yourfile.mp4)</label><input id="sr" value="${esc(x.src)}"></div><div class="full"><button class="btn gold" id="sv">Save video</button> <button class="btn ol" id="cn">Cancel</button></div></div>`;
$('cn').onclick=()=>{st.edit=null;vid()};$('sv').onclick=()=>{const o={...x,id:st.edit||Date.now(),title:$('ti').value||'Untitled',sku:$('sk').value,src:$('sr').value,thumb:$('pr').value,status:$('stt').value},go=()=>{MC.set('mc_videos',st.edit?V.map(a=>a.id==st.edit?o:a):[o,...V]);toast('Saved');st.edit=null;vid()};
const t=document.createElement('video');t.preload='metadata';t.src=o.src;t.onloadedmetadata=()=>{o.dur=t.duration||0;go()};t.onerror=()=>{toast('File not found, saved without duration');go()}}}
/* promotions */
function pro(){const l=MC.promos();$('mn').innerHTML=hd('Promotions','Discount codes customers can use at checkout')+`<div class="pn form"><div><label>Code</label><input id="cd" placeholder="e.g. WELCOME10"></div><div><label>Percent off</label><input id="pc" type="number" min="1" max="90"></div><div class="full"><button class="btn gold" id="ad">Add code</button></div></div><div class="pn"><table><tr><th>Code</th><th>Discount</th><th></th></tr>${l.map((x,i)=>`<tr><td><b>${x.code}</b></td><td>${x.pct}% off</td><td><button class="btn ol sm" data-d="${i}">Delete</button></td></tr>`).join('')||'<tr><td colspan="3">No codes yet. The first code is shown in the store banner.</td></tr>'}</table></div>`;
$('ad').onclick=()=>{const c=$('cd').value.trim().toUpperCase(),p=+$('pc').value;if(!c||!p)return toast('Enter a code and a percentage');MC.set('mc_promos',[...l,{code:c,pct:p}]);pro()};$('mn').onclick=e=>{const d=e.target.dataset.d;if(d!==undefined){MC.set('mc_promos',l.filter((_,i)=>i!=d));pro()}}}
function set(){$('mn').innerHTML=hd('Settings','')+`<div class="pn form"><div><label>WhatsApp number (country code, no +)</label><input id="w" value="${S.whatsapp}"></div><div><label>Currency symbol</label><input id="cu" value="${S.currency}"></div><div class="full"><label>Homepage headline</label><input id="h" value="${esc(S.headline)}"></div><div><label>New admin password</label><input id="pw" class="pwf" type="text" autocomplete="off" placeholder="Leave blank to keep"></div><div class="full"><button class="btn gold" id="ss">Save settings</button> <button class="btn ol" id="ex">Export backup</button> <button class="btn dg" id="rs">Reset products</button></div></div>`;
$('ss').onclick=()=>{S.whatsapp=$('w').value.replace(/\D/g,'');S.currency=$('cu').value;S.headline=$('h').value;if($('pw').value)S.password=$('pw').value.trim();MC.saveSettings(S)&&toast('Saved')};$('ex').onclick=()=>dl('miles-backup.json',JSON.stringify({products:P,videos:V,orders:O},null,1),'application/json');$('rs').onclick=()=>{if(confirm('Reset all products?')){localStorage.removeItem(MC.PK);toast('Reset')}}}
MC.ss.get('mc_in')?shell():login();
</script></body></html>
