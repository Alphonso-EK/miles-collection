<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lookbook | Miles Collection Stores</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-p="lookbook.html" data-h="none" class="lbk"><div id="bgw"></div><header class="tp"><a class="lg" href="index.html">M I L E S</a><nav><a href="lookbook.html" class="on">Lookbook</a><a href="shop.html">Shop</a><a href="collections.html">Collection</a><a href="about.html">About</a><a href="#" id="oc">🛍 <span class="cartn">0</span></a></nav></header>
<section class="gl"><small>Full screen video lookbook</small><h1>STORE LOOKBOOK 2026</h1><small id="mv"></small><div class="pg2"><span id="np" style="font-size:13px"></span></div><div class="pg2" id="pc2"><input type="range" id="rg" min="0" max="100" value="0" aria-label="Progress"><button class="ic2" id="pp" aria-label="Play or pause">❚❚</button><button class="ic2" id="vl" aria-label="Sound">🔇</button></div><hr><small id="ln"></small><div style="margin-top:10px"><small>Shop this look</small></div><div id="sl"></div><a class="sc" href="shop.html">SHOP COLLECTION →</a></section>
<aside class="rl"><h4>LOOKBOOK</h4><div id="ll"></div><div class="ac"><button id="hh" aria-label="Save look">♡</button><button id="sh" aria-label="Share">⇪</button><button id="dl" aria-label="Download">⭳</button><button id="sd" aria-label="Sound">🔊</button></div></aside><button class="so2" id="so">SOUND OFF</button><script src="js/data.js"></script><script src="js/site.js"></script><script>const L=[{t:'Store walk',v:1,src:'assets/store-tour.mp4',th:'assets/poster.jpg',ids:[1,6]},{t:'Pink street look',src:'assets/look-pink.jpg',th:'assets/look-pink.jpg',ids:[6]},{t:'Pearl bomber set',src:'assets/flatlay.jpg',th:'assets/flatlay.jpg',ids:[7,9]},{t:'Inside the store',src:'assets/store-kaws.jpg',th:'assets/store-kaws.jpg',ids:[1,5]},{t:'Sneaker wall',src:'assets/owner.jpg',th:'assets/owner.jpg',ids:[10,11,12]}];
let k=0,vd=null,lk=MC.get('mc_looks',[]);const f2=s=>{s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
$('ll').innerHTML=L.map((l,i)=>`<button class="lk" data-i="${i}"><img src="${l.th}" alt=""><span>LOOK ${String(i+1).padStart(2,'0')}<br>${l.t}${l.v?' ▶':''}</span></button>`).join('');
function show(i){k=i;const l=L[i];$('bgw').innerHTML=l.v?`<video class="bg" id="vd" src="${l.src}" poster="${l.th}" autoplay muted loop playsinline></video>`:`<img class="bg" src="${l.src}" alt="${l.t}">`;vd=l.v?$('vd'):null;
if(vd){vd.muted=snd;vd.ontimeupdate=()=>{$('rg').value=vd.currentTime/(vd.duration||1)*100;$('np').textContent='Now playing • '+f2(vd.currentTime)+' / '+f2(vd.duration)}}else $('np').textContent='Photo look';
$('mv').textContent='MOVEMENT '+['I','II','III','IV','V'][i]+' — '+l.t.toUpperCase();$('pc2').style.display=l.v?'flex':'none';$('ln').textContent='LOOK '+String(i+1).padStart(2,'0')+' / '+String(L.length).padStart(2,'0');
$('sl').innerHTML=l.ids.map(id=>P.find(p=>p.id==id)).filter(Boolean).map(p=>`<a class="li" href="product.html?id=${p.id}"><span>• ${p.name}</span><span>→ ${m(p.price)}</span></a>`).join('')||'<small>Ask us about this look on WhatsApp.</small>';
document.querySelectorAll('.lk').forEach((b,j)=>b.classList.toggle('on',j==i));$('hh').textContent=lk.includes(i)?'♥':'♡'}
let snd=false;function sound(){snd=!snd;if(vd)vd.muted=!snd;$('so').textContent='SOUND '+(snd?'ON':'OFF');$('vl').textContent=snd?'🔊':'🔇';$('sd').textContent=snd?'🔊':'🔇'}
$('ll').onclick=e=>{const b=e.target.closest('.lk');b&&show(+b.dataset.i)};$('pp').onclick=()=>{if(!vd)return;vd.paused?vd.play():vd.pause();$('pp').textContent=vd.paused?'▶':'❚❚'};
$('rg').oninput=e=>{if(vd&&vd.duration)vd.currentTime=e.target.value/100*vd.duration};$('vl').onclick=sound;$('sd').onclick=sound;$('so').onclick=sound;
$('hh').onclick=()=>{lk=lk.includes(k)?lk.filter(x=>x!=k):[...lk,k];MC.set('mc_looks',lk);$('hh').textContent=lk.includes(k)?'♥':'♡'};
$('sh').onclick=()=>{navigator.share?navigator.share({title:'Miles Collection lookbook',url:location.href}):navigator.clipboard.writeText(location.href).then(()=>alert('Link copied'))};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=L[k].src;a.download=L[k].t;a.click()};show(0);</script></body></html>
