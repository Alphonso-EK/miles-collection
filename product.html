<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Miles Collection Stores</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-p="product.html" data-h="noir" class="nr"><div class="wrap"><div id="pd"></div><div class="sh"><h2>You may also like</h2></div><div class="grid" id="rel" style="margin-bottom:40px"></div></div><script src="js/data.js"></script><script src="js/site.js"></script><script>const p=P.find(x=>x.id==new URLSearchParams(location.search).get('id'));
if(!p){$('pd').innerHTML='<div class="ph1"><h1>Product not found</h1><p><a href="shop.html">Back to the shop</a></p></div>'}else{
document.title=p.name+' | Miles Collection Stores';const I=MC.imgs(p),vs=p.video||'assets/store-tour.mp4',G=[{v:1},...I.map(s=>({s}))];let i=0,size=p.sizes.split(',')[0].trim();
$('pd').innerHTML=`<div class="nx"><div><div class="gm" id="gm"></div><div class="gt" id="gt"></div></div><div><div class="bc"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <a href="shop.html?c=${p.cat}">${p.cat}</a> / <b>${p.name}</b></div><h1>${p.name}</h1><div class="pr">${m(p.price)}</div><p class="ds">${p.desc}</p><div class="lb2">SIZE</div><div class="sz" id="sz">${p.sizes.split(',').map(s=>`<button class="${s.trim()==size?'on':''}">${s.trim()}</button>`).join('')}</div>
<button class="btn bk pill" id="ad" ${p.soldout?'disabled':''}>${p.soldout?'Sold out':'Add to Cart'}</button><br><button class="btn bo pill" id="wl" style="margin-top:12px">Add to Wishlist ♡</button>
<div class="ln">🏬 Collect in store on Greg Lungu Road, Lusaka</div><div class="ln">💬 Order and confirm on WhatsApp +260 970 444 582</div>
<details><summary>DETAILS & SIZES +</summary><p>${p.desc} Category: ${p.cat}. Sizes: ${p.sizes}.</p></details><details><summary>COLLECTION & PAYMENT +</summary><p>Send your order on WhatsApp and we will confirm stock, price and how to collect or arrange delivery.</p></details><a class="btn ol" id="wa" href="#" style="margin-top:16px">Ask about this item on WhatsApp</a></div></div>`;
function show(n){i=n;const g=G[n];$('gm').innerHTML=g.v?`<video src="${vs}" poster="${p.img}" controls playsinline></video><span class="tg">${p.video?'VIDEO':'STORE TOUR'} <i>●</i></span>`:`<img src="${g.s}" alt="${p.name}">`;
$('gt').innerHTML=G.map((g,k)=>`<button class="${k==n?'on':''}" data-k="${k}" aria-label="Media ${k+1}"><img src="${g.v?p.img:g.s}" alt="">${g.v?'<span class="pl">▶</span>':''}</button>`).join('')}
show(1);$('gt').onclick=e=>{const b=e.target.closest('button');b&&show(+b.dataset.k)};
$('sz').onclick=e=>{if(e.target.tagName=='BUTTON'){size=e.target.textContent;[...$('sz').children].forEach(b=>b.classList.toggle('on',b==e.target))}};
$('ad').onclick=()=>add(p.id,size);$('wl').onclick=()=>{fav=fav.includes(p.id)?fav.filter(x=>x!=p.id):[...fav,p.id];MC.set('mc_fav',fav);$('wl').textContent=fav.includes(p.id)?'In your Wishlist ♥':'Add to Wishlist ♡'};$('wl').textContent=fav.includes(p.id)?'In your Wishlist ♥':'Add to Wishlist ♡';
$('wa').href='https://wa.me/'+S.whatsapp+'?text='+encodeURIComponent('Hello Miles Collection, is the '+p.name+' available?');
$('rel').innerHTML=P.filter(x=>x.id!=p.id&&x.cat==p.cat).concat(P.filter(x=>x.cat!=p.cat)).slice(0,4).map(card).join('')}</script></body></html>
